<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NUMA" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>NUMA</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LEAN • STRONG • EXPLOSIVE</div>
        <h1>NUMA</h1>
      </div>
      <button id="installBtn" class="ghost hidden" type="button">Install</button>
    </header>

    <section class="status-card">
      <div>
        <div class="small">Training week</div>
        <div id="weekNumber" class="big">Week 1 of 6</div>
      </div>
      <div class="status-grid">
        <label>Energy
          <select id="energy">
            <option value="5">5 — Great</option>
            <option value="4">4 — Good</option>
            <option value="3" selected>3 — Normal</option>
            <option value="2">2 — Low</option>
            <option value="1">1 — Very low</option>
          </select>
        </label>
        <label>Leg soreness
          <select id="soreness">
            <option value="1">1 — Fresh</option>
            <option value="2">2 — Mild</option>
            <option value="3" selected>3 — Moderate</option>
            <option value="4">4 — Sore</option>
            <option value="5">5 — Very sore</option>
          </select>
        </label>
      </div>
    </section>

    <nav class="tabs" aria-label="Main navigation">
      <button data-tab="today" class="tab active">Today</button>
      <button data-tab="week" class="tab">Week</button>
      <button data-tab="strength" class="tab">Strength</button>
      <button data-tab="athletic" class="tab">Athletic</button>
      <button data-tab="progress" class="tab">Progress</button>
    </nav>

    <section id="today" class="panel"></section>
    <section id="week" class="panel hidden"></section>
    <section id="strength" class="panel hidden"></section>
    <section id="athletic" class="panel hidden"></section>
    <section id="progress" class="panel hidden"></section>

    <footer class="footer-actions">
      <button id="prevWeek" class="ghost" type="button">− Week</button>
      <button id="nextWeek" class="ghost" type="button">+ Week</button>
      <button id="resetData" class="danger" type="button">Reset data</button>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
